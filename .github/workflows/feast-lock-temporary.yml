name: Temporary Feast dependency lock
on:
  push:
    branches: [feat/feast-feature-ownership]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
      - name: Prepare project lock
        run: |
          uv python install 3.12
          uv lock
          uv sync --locked --group dev
      - name: Commit generated lock
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build(features): Feast 0.67.0 통합 의존성 잠금 갱신"
            git push origin HEAD:feat/feast-feature-ownership
          fi
