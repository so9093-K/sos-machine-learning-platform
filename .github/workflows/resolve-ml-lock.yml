name: Resolve ML dependency lock (temporary)

on:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/resolve-ml-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Resolve Python dependencies without modifying PR branch
        run: uv lock
      - name: Preserve resolved lock for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resolved-ml-uv-lock
          path: uv.lock
          if-no-files-found: error
      - name: Export resolved lock as public base64 log chunks
        run: |
          echo "__SOS_LOCK_BEGIN__"
          base64 -w0 uv.lock | fold -w 1024 | sed 's/^/SOS_LOCK_CHUNK=/'
          echo "__SOS_LOCK_END__"
