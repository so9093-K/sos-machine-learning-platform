name: One-time Dagster locked image build
on:
  push:
    branches: [feat/model-lifecycle-management]
permissions:
  contents: read
jobs:
  image:
    if: contains(github.event.head_commit.message, '[dagster-build-once]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dagster image from shared uv.lock
        run: docker build -f dagster/Dockerfile -t sos-dagster-locked:once .
      - name: Verify Dagster definitions and SQLAlchemy lock
        run: |
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/app/dagster sos-dagster-locked:once \
            -c 'import sqlalchemy; from sos_dagster.definitions import defs; assert sqlalchemy.__version__ == "2.1.4"; assert defs.get_job_def("activity_anomaly_workflow")'
