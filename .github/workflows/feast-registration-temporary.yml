name: Temporary Feast registration and API check
on:
  push:
    branches: [feat/feast-feature-ownership]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
      - name: Install locked Feast Runtime
        run: |
          uv python install 3.12
          uv sync --locked --group dev --group feast
      - name: Verify actual Feast Service registration and PIT lookup
        run: uv run --locked --group dev --group feast pytest -q tests/test_feast_live.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Regenerate API contracts from SOS OpenAPI
        run: bash scripts/generate_api_types.sh
      - name: Commit generated TypeScript schema
        run: |
          if ! git diff --quiet -- web/src/api.generated.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/api.generated.ts
            git commit -m "chore(api): Feature Service 등록·조회 API 타입 재생성"
            git push origin HEAD:feat/feast-feature-ownership
          fi
