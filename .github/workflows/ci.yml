name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새 커밋이 생기면 오래된 Python·Web 검사 자원 낭비를 방지한다.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API type generator
        working-directory: web
        run: npm ci --no-audit
      - name: Generate contract types for review
        run: |
          bash scripts/generate_api_types.sh
          echo SOS_GENERATED_TYPE_DIFF_BEGIN
          git diff -- web/src/api.generated.ts
          echo SOS_GENERATED_TYPE_DIFF_END

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Validate ML navigation context
        working-directory: web
        run: npm run test:navigation
      - name: Build web TypeScript and Vite
        working-directory: web
        run: npm run build


