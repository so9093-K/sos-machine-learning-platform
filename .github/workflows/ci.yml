name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Resolve Python lockfile for review
        run: |
          uv lock
          echo SOS_LOCK_BEGIN
          base64 -w0 uv.lock
          echo
          echo SOS_LOCK_END
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Format Python for review
        run: |
          uv run --locked ruff format .
          echo SOS_FORMAT_BEGIN
          for file in $(find src tests migrations scripts -name '*.py' | sort); do
            echo "FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FILE_END:$file"
          done
          echo SOS_FORMAT_END
      - name: Fix Ruff imports for review
        run: uv run --locked ruff check --fix . || true
      - name: Capture corrected imports
        run: |
          echo SOS_FIXED_BEGIN
          for file in $(find src tests migrations scripts -name '*.py' | sort); do
            echo "FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FILE_END:$file"
          done
          echo SOS_FIXED_END
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Start integration infrastructure
        run: docker compose -f compose.yaml -p sos-platform up -d --wait
      - name: Migrate database and prepare object storage
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m sos_platform.bootstrap
      - name: Unit and integration tests
        run: uv run --locked pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: TypeScript and Vite build
        working-directory: web
        run: npm run build
      - name: Frontend tests
        working-directory: web
        run: npm run test

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Python and JavaScript
        run: |
          uv python install
          uv sync --locked --group dev
          cd web && npm ci --no-audit && cd ..
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start SOS using public Make interface
        run: make up
      - name: Browser workflow tests
        working-directory: web
        run: npx playwright test
      - name: Make lifecycle and data persistence
        run: |
          make
          make help
          make up
          make status
          make doctor
          python3 scripts/dev.py doctor --deep --format json > /tmp/sos-doctor.json
          python3 -c 'import json; d=json.load(open("/tmp/sos-doctor.json")); assert d["status"]=="passed", d'
          make up
          printf 'timestamp,value\\n1,10\\n2,20\\n' > /tmp/sos-lifecycle.csv
          curl -fsS -F 'file=@/tmp/sos-lifecycle.csv' http://127.0.0.1:9602/api/datasets/files > /tmp/sos-dataset.json
          python3 -c 'import json; d=json.load(open("/tmp/sos-dataset.json")); assert d["id"]'
          make restart
          curl -fsS http://127.0.0.1:9602/api/datasets > /tmp/sos-restarted.json
          python3 -c 'import json; d=json.load(open("/tmp/sos-dataset.json")); rows=json.load(open("/tmp/sos-restarted.json")); assert any(x["id"]==d["id"] for x in rows)'
          make down
          make up
          curl -fsS http://127.0.0.1:9602/api/datasets > /tmp/sos-restored.json
          python3 -c 'import json; d=json.load(open("/tmp/sos-dataset.json")); rows=json.load(open("/tmp/sos-restored.json")); assert any(x["id"]==d["id"] for x in rows)'
          make check
          make logs > /tmp/sos-sanitized-logs.txt
      - name: Stop managed services without deleting data
        if: always()
        run: make down
      - name: Service diagnostics on failure
        if: failure()
        run: |
          for file in /tmp/sos-api.log /tmp/sos-worker.log /tmp/sos-web.log; do
            if [ -f "$file" ]; then
              echo "$file"
              tail -n 100 "$file"
            fi
          done

