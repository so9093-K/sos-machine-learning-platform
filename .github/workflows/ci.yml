name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Validate ML navigation context
        working-directory: web
        run: npm run test:navigation
      - name: Build web TypeScript and Vite
        working-directory: web
        run: npm run build

  pipeline-browser-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated test identity
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import secrets

          token = secrets.token_urlsafe(48)
          fingerprint = hashlib.sha256(token.encode()).hexdigest()
          users = {fingerprint: {"actor_id": "e2e-operator", "kind": "human", "roles": ["administrator"]}}
          with open(".env", "a", encoding="utf-8") as env:
              env.write("\nSOS_AUTH_TOKEN_HASHES=" + json.dumps(users, separators=(",", ":")) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("SOS_E2E_TOKEN=" + token + "\n")
          PY
      - name: Start real API, Worker, Web and storage
        run: make up
      - name: Verify browser Pipeline consumer journey
        run: node web/scripts/browser-pipeline-e2e.mjs
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-browser-e2e-failure
          path: artifacts/pipeline-e2e-failure.png
          if-no-files-found: ignore
      - name: Diagnose integration failures
        if: failure()
        run: docker compose --profile app logs --tail 100 api worker web
      - name: Remove isolated test services and volumes
        if: always()
        run: docker compose --profile app down -v --remove-orphans
