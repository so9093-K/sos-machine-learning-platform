name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all
      # 검증 후 삭제할 임시 Web 설치·빌드 점검
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify web lockfile installation
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Verify web production build
        run: npm run build
        working-directory: web
      - name: Verify npm lockfile reproducibility
        run: npm install --package-lock-only --ignore-scripts --offline --no-audit --no-fund && git diff --exit-code -- package-lock.json
        working-directory: web
