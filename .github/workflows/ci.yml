name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all

      - name: One-time PR33 tuned resource profile validation
        run: |
          mkdir -p /tmp/pr33-profiles
          for scenario in "1370000 8" "1370000 63"; do
            set -- $scenario
            rows=$1
            width=$2
            data=/tmp/pr33-profiles/data.parquet
            uv run --locked python scripts/_pr33_resource_profiles_temp.py generate "$rows" "$width" "$data"
            for memory in 2048 4096 8192; do
              uv run --locked python scripts/_pr33_resource_profiles_temp.py measure "$rows" "$width" "$data" --memory "$memory" --variant product
            done
            uv run --locked python scripts/_pr33_resource_profiles_temp.py measure "$rows" "$width" "$data" --memory 8192 --variant baseline
            if [ "$width" -eq 63 ]; then
              uv run --locked python scripts/_pr33_resource_profiles_temp.py measure "$rows" "$width" "$data" --memory 4096 --variant baseline
            fi
            rm -f "$data"
          done
          uv run --locked ruff check src/sos_platform/ml_sampling.py src/sos_platform/ml_training.py tests/test_ml_training_inputs.py
