name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Validate Python lockfile
        run: uv lock --check
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint and format
        run: uv run --locked python scripts/verify.py run ruff
      - name: Python unit tests
        run: uv run --locked python scripts/verify.py run python-unit
      - name: Verify Markdown links
        run: python3 scripts/check_doc_links.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend dependencies for API types
        run: cd web && npm ci --no-audit
      - name: Verify generated OpenAPI types
        run: uv run --locked python scripts/verify.py run openapi-types
      - name: Verify API backward compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/verify.py run openapi-compat --base-ref "$BASE_SHA"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Build and Vitest
        run: python3 scripts/verify.py run frontend

  python-integration:
    needs: [python-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --group dev
      - name: Start integration infrastructure
        run: docker compose -f compose.yaml -p sos-platform up -d --wait
      - name: Prepare database and storage
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m sos_platform.bootstrap
      - name: Verify distributable wheel
        run: uv run --locked python scripts/verify.py run wheel
      - name: PR critical integration cases
        if: github.event_name == 'pull_request'
        run: uv run --locked python scripts/verify.py run python-integration
      - name: Complete integration suite
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/verify.py run python-integration
      - name: Verify metadata schema matches migration
        run: uv run --locked python scripts/verify.py run alembic

  ui-e2e:
    if: github.event_name != 'push'
    needs: [python-fast, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Python and JavaScript
        run: |
          uv python install
          uv sync --locked --group dev
          cd web && npm ci --no-audit
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: PR core browser user and permission scenarios
        if: github.event_name == 'pull_request'
        run: uv run --locked python scripts/verify.py run workspace-e2e --output-dir web/reports
      - name: Full browser user flows
        if: github.event_name != 'pull_request'
        run: uv run --locked python scripts/verify.py run workspace-e2e --output-dir web/reports
      - name: Save failure trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-trace
          path: |
            web/reports/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  python-quality:
    if: always()
    needs: [python-fast, frontend, python-integration, ui-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks selected for this event
        env:
          EVENT: ${{ github.event_name }}
          FAST: ${{ needs.python-fast.result }}
          FRONTEND: ${{ needs.frontend.result }}
          INTEGRATION: ${{ needs.python-integration.result }}
          E2E: ${{ needs.ui-e2e.result }}
        run: |
          test "$FAST" = "success"
          test "$FRONTEND" = "success"
          test "$INTEGRATION" = "success"
          if [ "$EVENT" != "push" ]; then
            test "$E2E" = "success"
          fi
