name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all
      # 이 PR에서만 baseline과 신규 OpenAPI 완전 동등성을 비교한다. 검증 뒤 복원.
      - name: Compare OpenAPI with main
        env:
          BASE_COMMIT: "fe421c08112424fc8f6a4c4ee6404be4823bae45"
        run: |
          uv run --locked python scripts/export_openapi.py > "$RUNNER_TEMP/current-openapi.json"
          git worktree add --detach "$RUNNER_TEMP/sos-baseline" "$BASE_COMMIT"
          (
            cd "$RUNNER_TEMP/sos-baseline"
            uv run --locked python scripts/export_openapi.py > "$RUNNER_TEMP/baseline-openapi.json"
          )
          diff -u "$RUNNER_TEMP/baseline-openapi.json" "$RUNNER_TEMP/current-openapi.json"


      - name: Check changed Python modules
        run: uv run --locked ruff check src/sos_platform/api.py src/sos_platform/api_ml_training.py
      - name: Probe Training HTTP authorization and listing
        run: |
          uv run --locked python - <<'PY'
          from hashlib import sha256
          from unittest.mock import Mock
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          from sos_platform.api_ml_training import training_router
          from sos_platform.security import Actor, IdentitySettings

          viewer_token = "v" * 40
          viewer = Actor("viewer", "human", frozenset({"viewer"}))
          app = FastAPI()
          app.state.identity = IdentitySettings("token", {
              sha256(viewer_token.encode()).hexdigest(): viewer
          })
          store = Mock()
          store.jobs.return_value = []
          app.include_router(training_router(
              store,
              existing_dataset=lambda *args: {"id": "dataset-1", "version": "v1"},
              existing_job=lambda *args: {"id": "job-1", "kind": "ml_train"},
              require_submission_key=lambda key: None,
          ))
          client = TestClient(app)
          credentials = {"Authorization": f"Bearer {viewer_token}"}
          listed = client.get("/api/ml/train/jobs", headers=credentials)
          assert listed.status_code == 200, (listed.status_code, listed.text)
          assert listed.json()["items"] == []
          denied = client.post("/api/ml/train/jobs", headers=credentials,
              json={"dataset_id": "dataset-1", "features": ["x"]})
          assert denied.status_code == 403, (denied.status_code, denied.text)
          unauthenticated = client.get("/api/ml/train/jobs")
          assert unauthenticated.status_code == 401
          invalid_page = client.get("/api/ml/train/jobs?limit=0", headers=credentials)
          assert invalid_page.status_code == 422
          store.create_job.assert_not_called()
          print("Training API auth/list/validation smoke OK")
          PY
