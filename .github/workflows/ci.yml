name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all

      # 일회성 리뷰용: 검증 후 이 단계는 제거하고 Workflow를 원상 복구한다.
      - name: Ruff and Python training evidence tests
        run: |
          uv run --locked ruff check src/sos_platform/ml_training.py src/sos_platform/ml_input.py src/sos_platform/ml_scoring.py src/sos_platform/schemas.py tests/test_ml_training_inputs.py
          uv run --locked pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify OpenAPI types and Web production build
        run: |
          cd web
          npm ci --no-audit --no-fund
          cd ..
          bash scripts/generate_api_types.sh
          git diff --exit-code -- web/src/api.generated.ts
          cd web
          npm run build
      - name: Benchmark full-file training input selection
        run: |
          uv run --locked python - <<'PY'
          from contextlib import contextmanager
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from time import monotonic

          import numpy as np
          import polars as pl

          from sos_platform import ml_training

          count = 1_370_000
          features = [f"signal_{i}" for i in range(8)]
          with TemporaryDirectory() as temp:
              path = Path(temp) / "large.parquet"
              values = np.arange(count, dtype=np.float64)
              pl.DataFrame({field: values + i for i, field in enumerate(features)}).write_parquet(path)
              del values

              @contextmanager
              def scan(store, dataset):
                  yield pl.scan_parquet(path)

              ml_training.pinned_scan_dataset = scan
              started = monotonic()
              matrix, evidence = ml_training.training_matrix(
                  None, {}, features, seed=42, worker_memory_mib=256
              )
              duration = monotonic() - started
              assert evidence["source_rows"] == count
              assert 50_000 < evidence["selected_rows"] < count
              assert matrix.shape == (evidence["selected_rows"], len(features))
              assert duration < 120, duration
              print(f"{count} input rows, {evidence['selected_rows']} selected, {duration:.2f}s")
          PY
