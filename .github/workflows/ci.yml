name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 기본 브랜치에서만 정기 실행; PR 품질 게이트에는 추가 비용을 주지 않는다.
  schedule:
    - cron: '17 17 * * *' # 02:17 KST
  workflow_dispatch:

concurrency:
  # PR은 같은 번호끼리 묶고 main의 각 실행은 고유한 ID를 가진다.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  # main의 필수 검증은 보존하고 오래된 PR HEAD만 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PR base OpenAPI를 별도 Worktree에서 생성
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Validate Python lockfile
        run: uv lock --check
      - name: Verify Markdown links
        run: python3 scripts/check_doc_links.py
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend dependencies for API types
        run: cd web && npm ci --no-audit
      - name: Verify generated OpenAPI types
        run: uv run --locked python scripts/verify.py run openapi-types --output-dir /tmp/sos-openapi-types
      - name: Verify API backward compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/verify.py run openapi-compat --base-ref "$BASE_SHA" --output-dir /tmp/sos-openapi-compat
      - name: Ruff lint and format (common Suite)
        run: uv run --locked python scripts/verify.py run ruff --output-dir /tmp/sos-ruff
      - name: Explain Ruff format failure
        if: failure()
        run: uv run --locked ruff format --diff .
      - name: Infrastructure-free Python tests
        run: uv run --locked python scripts/verify.py run python-unit --output-dir /tmp/sos-python-unit
      - name: Verify native test inventory
        run: uv run --locked python scripts/verify.py inventory --output /tmp/sos-test-inventory.json
      - name: Start integration infrastructure
        run: docker compose -f compose.yaml -p sos-platform up -d --wait
      - name: Migrate database and prepare object storage
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m sos_platform.bootstrap
      - name: Verify installed wheel can read packaged Alembic HEAD
        run: uv run --locked python scripts/verify.py run wheel --output-dir /tmp/sos-wheel-check
      - name: Infrastructure integration tests
        run: uv run --locked python scripts/verify.py run python-integration --output-dir /tmp/sos-python-integration
      - name: Publish Python test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-report
          path: |
            /tmp/sos-python-unit/*.xml
            /tmp/sos-python-unit/python-unit.manifest.json
            /tmp/sos-test-inventory.json
            /tmp/sos-python-integration/*.xml
            /tmp/sos-python-integration/python-integration.manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify metadata schema matches migration
        run: uv run --locked python scripts/verify.py run alembic --output-dir /tmp/sos-alembic
      - name: Extended module-order regression (scheduled/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          uv run --locked pytest -q tests/integration/test_iceberg.py tests/integration/test_jobs.py
          uv run --locked pytest -q tests/integration/test_jobs.py tests/integration/test_iceberg.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Frontend build and Vitest (common Suite)
        run: python3 scripts/verify.py run frontend --output-dir /tmp/sos-frontend
      - name: Save Frontend JUnit and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-test-report
          path: /tmp/sos-frontend/
          if-no-files-found: ignore
          retention-days: 7

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Python and JavaScript
        run: |
          uv python install
          uv sync --locked --group dev
          cd web && npm ci --no-audit && cd ..
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests in separate E2E volumes
        run: uv run --locked python scripts/verify.py run workspace-e2e --output-dir web/reports
      - name: Make lifecycle and data persistence (owned environment)
        run: uv run --locked python scripts/verify.py run make-lifecycle --output-dir web/reports
      - name: Verify token-mode browser permissions (owned environment)
        run: uv run --locked python scripts/verify.py run token-rbac --output-dir web/reports

      - name: Save browser JUnit and failure trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-report
          path: |
            web/reports/*.xml
            web/reports/*.json
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7


  # 보호 규칙의 python-quality 상태가 3개 핵심 검증을 모두 대표하도록 한다.
  python-quality:
    if: always()
    needs: [python-tests, frontend, ui-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every critical CI job
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.ui-e2e.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$E2E_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native JUnit and inventory reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-test-report'
          path: validation-artifacts
          merge-multiple: false
      - name: Reconcile native inventory with every required JUnit report
        run: |
          python3 scripts/verify_inventory.py reconcile \
            --inventory validation-artifacts/python-test-report/sos-test-inventory.json \
            --pytest-report validation-artifacts/python-test-report/sos-python-unit/python-unit.xml \
            --pytest-report validation-artifacts/python-test-report/sos-python-integration/python-integration.xml \
            --vitest-report validation-artifacts/frontend-test-report/frontend.xml \
            --playwright-report validation-artifacts/browser-test-report/reports/workspace-e2e.xml \
            --playwright-report validation-artifacts/browser-test-report/reports/token-rbac.xml
