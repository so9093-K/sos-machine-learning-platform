name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새 커밋이 생기면 오래된 Python·Web 검사 자원 낭비를 방지한다.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all




  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      # PR 작업 중 API 응답·요청 타입을 실제 생성기로 대조하는 임시 단계.
      - uses: astral-sh/setup-uv@v7
      - name: Install Python for OpenAPI generation
        run: uv python install 3.12 && uv sync --locked --group dev
      - name: Inspect generated TypeScript API diff
        working-directory: web
        run: npm run generate:types && git diff -- src/api.generated.ts
      - name: Validate ML navigation context
        working-directory: web
        run: npm run test:navigation
      - name: Build web TypeScript and Vite
        working-directory: web
        run: npm run build


