name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run configured product validation
        run: python scripts/validate.py run all

      # Temporary policy audit — remove this after focused verification.
      - name: Review Training policy Ruff and API
        run: |
          uv run --locked ruff check src/sos_platform/ml_training.py src/sos_platform/api_ml_training.py src/sos_platform/schemas.py src/sos_platform/errors.py tests/test_ml_training_inputs.py
          uv run --locked pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate Training OpenAPI web types
        run: |
          cd web
          npm ci --no-audit --no-fund
          cd ..
          bash scripts/generate_api_types.sh
          echo "=== BEGIN GENERATED WEB TYPES DIFF ==="
          git diff -- web/src/api.generated.ts
          echo "=== END GENERATED WEB TYPES DIFF ==="
      - name: Build Web with regenerated types
        run: npm run build
        working-directory: web
