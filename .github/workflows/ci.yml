name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --group dev
      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Python unit tests
        run: uv run --locked pytest -q tests/test_*.py
      - name: Documentation links
        run: python3 scripts/check_doc_links.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install frontend
        working-directory: web
        run: npm ci --no-audit
      - name: Build and frontend tests
        working-directory: web
        run: |
          npm run build
          npm test
      - name: Generated OpenAPI types
        run: |
          cd web
          npm run generate:types
          cd ..
          git diff --exit-code -- web/src/api.generated.ts
      - name: OpenAPI compatibility with PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/verify_openapi.py --base-ref "$BASE_SHA"

  integration:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked --group dev
      - name: Start integration services
        run: docker compose -f compose.yaml -p sos-platform up -d --wait
      - name: Prepare database and object storage
        run: |
          uv run --locked alembic upgrade head
          uv run --locked python -m sos_platform.bootstrap
      - name: Distribution wheel
        run: uv run --locked python scripts/verify_wheel.py
      - name: Python integration tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run --locked pytest -q -m pr tests/integration
          else
            uv run --locked pytest -q tests/integration
          fi
      - name: Alembic schema
        run: uv run --locked alembic check

  browser:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Python and frontend
        run: |
          uv python install
          uv sync --locked --group dev
          cd web && npm ci --no-audit
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Isolated browser flows
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run --locked python scripts/isolated_compose.py --spec all --grep '@pr'
          else
            uv run --locked python scripts/isolated_compose.py --spec all
          fi
      - name: Save failure trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-trace
          path: |
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  python-quality:
    if: always()
    needs: [checks, integration, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require real tests for this event
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$CHECKS" = "success"
          test "$INTEGRATION" = "success"
          test "$BROWSER" = "success"
