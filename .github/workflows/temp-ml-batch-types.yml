name: Temporary batch scoring API type verification
on:
  push:
    branches:
      - feat/ml-time-scoped-batch-scoring
permissions:
  contents: read
jobs:
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Python
        run: uv python install 3.12
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Install Web dependencies
        run: cd web && npm ci
      - name: Verify regenerated types and Web build
        run: |
          bash scripts/generate_api_types.sh
          git diff --exit-code -- web/src/api.generated.ts
          cd web
          npm run build
