name: Resolve ML OpenAPI types (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/temporary-ml-types.yml
      - src/sos_platform/schemas.py
      - src/sos_platform/api.py
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: bash scripts/generate_api_types.sh
      - name: Export generated types via CI log
        run: |
          echo "__SOS_API_TYPE_BEGIN__"
          base64 -w0 web/src/api.generated.ts | fold -w 1024 | sed 's/^/SOS_API_TYPE_CHUNK=/'
          echo "__SOS_API_TYPE_END__"
