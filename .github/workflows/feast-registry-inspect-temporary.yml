name: Temporary Feast lifecycle integration
on:
  push:
    branches: [feat/feast-feature-ownership]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv python install 3.12
          uv sync --locked --group feast --group dev
      - name: Feast actual SQL Registry recovery and PIT
        run: uv run --locked --group feast --group dev pytest -q tests/test_feast_live.py tests/test_feast_features.py
