name: Temporary Feast full storage diagnostic
on:
  push:
    branches: [feat/feast-feature-ownership]
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
      - name: Install locked Feast development Runtime
        run: |
          uv python install 3.12
          uv sync --locked --group dev --group feast
      - name: Run registration, PIT and API contract regression
        run: uv run --locked --group dev --group feast pytest -q tests/test_feast_features.py tests/test_feast_live.py
      - name: Run original SOS Python product validation
        run: python scripts/validate.py run all
      - name: Start actual SeaweedFS and PostgreSQL
        run: |
          docker compose up -d --wait storage
          docker run --rm -d --name sos-feast-review-db -p 5432:5432 -e POSTGRES_USER=feast -e POSTGRES_PASSWORD=feast-dev-only -e POSTGRES_DB=sos_feast postgres:17
          for i in $(seq 1 40); do
            if docker exec sos-feast-review-db pg_isready -U feast -d sos_feast; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real SeaweedFS S3 + SQL Registry
        env:
          SOS_TEST_FEAST_STORAGE_INTEGRATION: "1"
          SOS_S3_ENDPOINT: http://127.0.0.1:9605
          SOS_FEAST_REGISTRY_URL: postgresql+psycopg2://feast:feast-dev-only@127.0.0.1:5432/sos_feast
        run: uv run --locked --group dev --group feast pytest -q tests/test_feast_s3_postgres.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Regenerate API types
        run: bash scripts/generate_api_types.sh
      - name: Build web TypeScript and Vite with regenerated contracts
        working-directory: web
        run: npm run build
      - name: Commit generated types only
        run: |
          if ! git diff --quiet -- web/src/api.generated.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/api.generated.ts
            git commit -m "chore(api): Feast review schema types regenerate"
            git push origin HEAD:feat/feast-feature-ownership
          fi
