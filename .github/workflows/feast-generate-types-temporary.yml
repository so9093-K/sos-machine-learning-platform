name: Temporary Feast API type generation
on:
  push:
    branches: [feat/feast-feature-ownership]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.12 && uv sync --locked --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit
      - name: Generate from SOS OpenAPI and commit to feature branch
        run: |
          bash scripts/generate_api_types.sh
          if ! git diff --quiet -- web/src/api.generated.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/api.generated.ts
            git commit -m "chore(api): Feast OpenAPI 생성 TypeScript 타입 동기화"
            git push origin HEAD:feat/feast-feature-ownership
          fi
