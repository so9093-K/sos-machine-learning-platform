name: One-time model lifecycle final validation
on:
  push:
    branches: [feat/model-lifecycle-management]
permissions:
  contents: read
jobs:
  product:
    if: contains(github.event.head_commit.message, '[model-check-once]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q tests
      - run: npm ci --prefix web --no-audit
      - run: npm --prefix web run build
