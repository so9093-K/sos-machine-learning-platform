name: Temporary observation preparation API types
on:
  push:
    branches:
      - feat/observation-id-dataset-preparation
permissions:
  contents: read
jobs:
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python
        run: uv python install 3.12
      - name: Python dependencies
        run: uv sync --locked --group dev
      - name: Web dependencies
        run: cd web && npm ci
      - name: Generate API types and print diff
        run: |
          bash scripts/generate_api_types.sh
          echo GEN_DIFF_START
          git diff -- web/src/api.generated.ts | base64 -w0
          echo
          echo GEN_DIFF_END
