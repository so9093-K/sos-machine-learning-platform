name: Temporary Feast UI uv lock sync
on:
  push:
    branches: [feat/feast-ui-catalog]
permissions:
  contents: write
concurrency:
  group: feast-ui-lock-sync
  cancel-in-progress: true
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - name: Resolve official Feast gRPC extras with uv.lock
        run: uv lock
      - name: Commit updated lock
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build(feast): UI gRPC 선택 의존성 uv.lock 갱신"
            git push origin HEAD:feat/feast-ui-catalog
          fi
