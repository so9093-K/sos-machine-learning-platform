name: Temporary Feast lifecycle full Compose validation
on:
  push:
    branches: [feat/feast-feature-ownership]
permissions:
  contents: read
concurrency:
  group: feast-lifecycle-compose
  cancel-in-progress: true
jobs:
  full-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked SOS Python
        run: |
          uv python install 3.12
          uv sync --locked --group dev
      - name: Configure isolated local administrator
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib, json
          token = "review-feast-full-compose-token-value-012345678901234"
          users = {hashlib.sha256(token.encode()).hexdigest(): {
              "actor_id": "feast-review-administrator", "kind": "human",
              "roles": ["administrator"]}}
          print("SOS_AUTH_TOKEN_HASHES=" + json.dumps(users, separators=(",", ":")))
          PY
      - name: Build SOS and Feast services
        run: docker compose --profile app up --build -d --wait init api worker mlflow feast-postgres
      - name: Registration, PIT, model lineage, protected retention and deletion
        env:
          SOS_TEST_FEAST_COMPOSE: "1"
        run: uv run --locked --group dev pytest -q tests/test_feast_compose_flow.py
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 170 init api worker feast-postgres storage mlflow
      - name: Remove isolated services
        if: always()
        run: docker compose --profile app down --volumes || true
