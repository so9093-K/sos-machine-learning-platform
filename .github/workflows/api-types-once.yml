name: One-time generated OpenAPI types
on:
  push:
    branches: [feat/model-lifecycle-management]
permissions:
  contents: write
jobs:
  api-types:
    if: contains(github.event.head_commit.message, '[api-types-once]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: npm ci --prefix web --no-audit
      - run: bash scripts/generate_api_types.sh
      - name: Commit generated OpenAPI types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/api.generated.ts
          if ! git diff --cached --quiet; then
            git commit -m "build(web): regenerate OpenAPI TypeScript bindings"
            git push origin HEAD:feat/model-lifecycle-management
          fi
