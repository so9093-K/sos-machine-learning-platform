# app 프로필은 공개 기본 실행이며, 프로필을 비활성화하면 테스트용 DB·S3만 기동한다.
name: sos-platform
x-sos-storage-env: &sos-storage-env
  SOS_DB_HOST: postgres
  SOS_DB_PORT: "5432"
  SOS_DB_USER: ${SOS_DB_USER:-sos}
  SOS_DB_PASSWORD: ${SOS_DB_PASSWORD:-sos-dev-only}
  SOS_DB_NAME: ${SOS_DB_NAME:-sos}
  SOS_S3_ENDPOINT: http://storage:8333
  SOS_S3_ACCESS_KEY: ${SOS_S3_ACCESS_KEY:-sos-dev}
  SOS_S3_SECRET_KEY: ${SOS_S3_SECRET_KEY:-sos-dev-secret}
  SOS_S3_BUCKET: ${SOS_S3_BUCKET:-sos-data}
  SOS_S3_REGION: ${SOS_S3_REGION:-us-east-1}

x-sos-python-build: &sos-python-build
  context: .
  dockerfile: Dockerfile

x-sos-logging: &sos-logging
  driver: json-file
  options:
    max-size: "2m"
    max-file: "3"

services:
  init:
    logging: *sos-logging
    profiles: [app]
    image: ${SOS_PYTHON_IMAGE:-sos-platform-python:local}
    build: *sos-python-build
    environment: *sos-storage-env
    command: ["sh", "-c", "alembic upgrade head && python -m sos_platform.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  api:
    logging: *sos-logging
    profiles: [app]
    image: ${SOS_PYTHON_IMAGE:-sos-platform-python:local}
    build: *sos-python-build
    environment:
      <<: *sos-storage-env
      SOS_AUTH_MODE: token
      SOS_AUTH_TOKEN_HASHES: ${SOS_AUTH_TOKEN_HASHES:-}
      SOS_MLFLOW_TRACKING_URI: ${SOS_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      SOS_MLFLOW_ALLOW_INSECURE_HTTP: ${SOS_MLFLOW_ALLOW_INSECURE_HTTP:-true}
      SOS_MLFLOW_TOKEN: ${SOS_MLFLOW_TOKEN:-}
    command:
      - uvicorn
      - sos_platform.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "9602"
      - --no-proxy-headers
    volumes:
      - api_state:/var/lib/sos
    ports:
      - "127.0.0.1:${SOS_API_PORT:-9602}:9602"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9602/api/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    logging: *sos-logging
    profiles: [app]
    image: ${SOS_PYTHON_IMAGE:-sos-platform-python:local}
    build: *sos-python-build
    environment:
      <<: *sos-storage-env
      # MLflow는 설정되지 않으면 연결하지 않는다. 자격 증명은 Worker에만 전달한다.
      SOS_MLFLOW_TRACKING_URI: ${SOS_MLFLOW_TRACKING_URI:-http://mlflow:5000}
      SOS_MLFLOW_TOKEN: ${SOS_MLFLOW_TOKEN:-}
      SOS_MLFLOW_ALLOW_INSECURE_HTTP: ${SOS_MLFLOW_ALLOW_INSECURE_HTTP:-true}
    command: ["python", "-m", "sos_platform.worker"]
    volumes:
      - worker_state:/var/lib/sos
    depends_on:
      init:
        condition: service_completed_successfully
    stop_grace_period: 35s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    logging: *sos-logging
    profiles: [app]
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${SOS_WEB_IMAGE:-sos-platform-web-dev:local}
    environment:
      SOS_WEB_PORT: "9601"
      SOS_API_INTERNAL_URL: http://api:9602
    ports:
      - "127.0.0.1:${SOS_WEB_PORT:-9601}:9601"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9601/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  mlflow:
    logging: *sos-logging
    profiles: [app]
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/artifacts
      - --allowed-hosts
      - mlflow,localhost,127.0.0.1
    ports:
      - "127.0.0.1:${SOS_MLFLOW_PORT:-9606}:5000"
    volumes:
      - mlflow_data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  postgres:
    logging: *sos-logging
    image: postgres:17
    environment:
      POSTGRES_USER: ${SOS_DB_USER:-sos}
      POSTGRES_PASSWORD: ${SOS_DB_PASSWORD:-sos-dev-only}
      POSTGRES_DB: ${SOS_DB_NAME:-sos}
    ports:
      - "127.0.0.1:${SOS_DB_PORT:-9603}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOS_DB_USER:-sos} -d ${SOS_DB_NAME:-sos}"]
      interval: 2s
      retries: 30
      timeout: 3s
  storage:
    logging: *sos-logging
    # 객체 저장소 공급자는 S3 계약 뒤에서 교체할 수 있다.
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${SOS_S3_ACCESS_KEY:-sos-dev}
      AWS_SECRET_ACCESS_KEY: ${SOS_S3_SECRET_KEY:-sos-dev-secret}
      S3_BUCKET: ${SOS_S3_BUCKET:-sos-data}
    ports:
      - "127.0.0.1:${SOS_S3_PORT:-9605}:8333"
    volumes:
      - object_data:/data
    # 초기화 명령은 S3 리스너가 실제로 연결을 받을 때까지 기다린다.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 30


volumes:
  postgres_data:
  object_data:
  api_state:
  worker_state:
  mlflow_data:
