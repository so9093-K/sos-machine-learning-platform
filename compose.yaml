name: sos-platform
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SOS_DB_USER:-sos}
      POSTGRES_PASSWORD: ${SOS_DB_PASSWORD:-sos-dev-only}
      POSTGRES_DB: ${SOS_DB_NAME:-sos}
    ports:
      - "127.0.0.1:${SOS_DB_PORT:-9603}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOS_DB_USER:-sos} -d ${SOS_DB_NAME:-sos}"]
      interval: 2s
      retries: 30
      timeout: 3s
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SOS_S3_ACCESS_KEY:-sos-dev}
      MINIO_ROOT_PASSWORD: ${SOS_S3_SECRET_KEY:-sos-dev-secret}
    ports:
      - "127.0.0.1:${SOS_S3_PORT:-9605}:9000"
      - "127.0.0.1:${SOS_S3_CONSOLE_PORT:-9606}:9001"
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 30
      timeout: 3s
volumes:
  postgres_data:
  object_data:
