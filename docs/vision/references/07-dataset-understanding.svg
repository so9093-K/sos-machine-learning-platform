<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 454" role="img" aria-labelledby="title desc">
  <title id="title">알 수 없는 Dataset에서 시작하는 연구 경험</title>
  <desc id="desc">알 수 없는 Dataset에서 System Discovery와 Dataset Understanding을 거쳐 Explore, Prepare, Experiment 중 자유롭게 선택하는 비선형 경험</desc>
  <rect width="780" height="454" fill="#080808" rx="12"/>
  <rect x="10" y="7" width="760" height="440" fill="none" stroke="#3b3b3b" rx="8"/>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" fill="#f5f5f5" text-anchor="middle">
    <text x="390" y="50" font-size="16" font-weight="700">알 수 없는 Dataset</text>
    <text x="390" y="75" font-size="14">CSV, Parquet, DB, API, Iceberg 등</text>
    <text x="390" y="115" font-size="18" fill="#a8a8a8">↓</text>
    <rect x="23" y="134" width="734" height="73" rx="6" fill="none" stroke="#444"/>
    <text x="390" y="166" font-size="16" font-weight="700">System Discovery</text>
    <text x="390" y="190" font-size="14">구조 · 자료형 · 통계 · 품질 · 가능한 역할 추론</text>
    <text x="390" y="233" font-size="18" fill="#a8a8a8">↓</text>
    <text x="390" y="280" font-size="16" font-weight="700">Dataset Understanding</text>
    <text x="390" y="304" font-size="14">시스템이 발견한 사실과 아직 모르는 것을 설명</text>
    <text x="390" y="344" font-size="18" fill="#a8a8a8">⑂</text>
    <g fill="none" stroke="#444">
      <rect x="23" y="365" width="238" height="49" rx="6"/>
      <rect x="271" y="365" width="238" height="49" rx="6"/>
      <rect x="519" y="365" width="238" height="49" rx="6"/>
    </g>
    <text x="142" y="385" font-size="13">Explore</text>
    <text x="142" y="403" font-size="11">데이터 이해</text>
    <text x="390" y="385" font-size="13">Prepare</text>
    <text x="390" y="403" font-size="11">데이터 준비</text>
    <text x="638" y="385" font-size="13">Experiment</text>
    <text x="638" y="403" font-size="11">연구·실험</text>
    <text x="390" y="437" font-size="13">한 방향으로만 진행하는 파이프라인이 아니라, 이해한 만큼 여러 작업으로 확장되는 시스템</text>
  </g>
</svg>
