[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sos-machine-learning-platform"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "polars>=1.35,<2",
  "duckdb==1.5.6",
  "pyarrow>=19,<24",
  "pyiceberg[sql-postgres]>=0.10,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "alembic>=1.16,<2",
  "boto3>=1.35,<2",
  "scalar-fastapi>=1.4,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest==9.0.2",
  "ruff==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sos_platform"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "sos_platform/alembic.ini"
"migrations" = "sos_platform/migrations"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
